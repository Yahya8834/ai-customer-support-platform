name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-test-secret-key
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=postgresql://postgres:postgres@db:5432/customer_support
          AI_SERVICE_URL=http://ai_service:8001
          CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
          RABBITMQ_DEFAULT_USER=guest
          RABBITMQ_DEFAULT_PASS=guest
          EOF

      - name: Create AI service CI environment
        run: |
          cat > backend/ai_service/.env <<'EOF'
          BGE_API_URL=http://localhost:11434
          BGE_MODEL=bge-m3:567m
          LLM_API_URL=http://localhost:11434
          QWEN_INFERENCE_KEY=ci-test-key
          EOF

      - name: Build development containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          until docker compose exec -T db pg_isready -U postgres -d customer_support; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run backend tests
        run: docker compose exec -T web python manage.py test --exclude-tag=integration

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create frontend CI environment
        run: cp frontend/.env.example frontend/.env.local

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-test-secret-key
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1,web
          DATABASE_URL=postgresql://postgres:postgres@db:5432/customer_support
          AI_SERVICE_URL=http://ai_service:8001
          CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
          RABBITMQ_DEFAULT_USER=guest
          RABBITMQ_DEFAULT_PASS=guest
          EOF

      - name: Start Django service
        run: docker compose up -d db web

      - name: Build frontend container
        run: docker compose build frontend

      - name: Run frontend unit tests
        run: docker compose run --rm frontend npm test -- --runInBand --testPathIgnorePatterns=client.integration.test.ts

      - name: Run frontend integration tests
        run: docker compose run --rm frontend npm test -- --runInBand src/lib/api/tests/client.integration.test.ts