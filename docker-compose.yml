services:
  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    container_name: customer-support-web

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - rabbitmq

    command: python manage.py runserver 0.0.0.0:8000

  db:
    image: pgvector/pgvector:pg17

    container_name: customer-support-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: customer_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management

    container_name: customer-support-rabbitmq

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  document_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    container_name: customer-support-document-worker

    volumes:
      - ./backend:/app

    env_file:
      - .env

    depends_on:
      - db
      - rabbitmq
      - ai_service

    command: python manage.py consume_document_uploaded
    
  ai_service:
    build:
      context: ./backend/ai_service
    container_name: ai_service
    env_file:
      - ./backend/ai_service/.env
    ports:
      - "8001:8001"
    volumes:
      - ./backend/ai_service:/app

  redis:
    image: redis:8-alpine
    container_name: customer-support-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  rabbitmq_data: